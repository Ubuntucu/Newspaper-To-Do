name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html www/

      - name: Install Dependencies & Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --save-dev
          npx cap init "Gunluk Gorev Takibi" "com.gunlukgorev.app" --web-dir www
          npx cap add android

      - name: Generate App Icons
        run: |
          npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: |
          npx cap copy android
          npx cap update android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gunluk-Gorev-Takibi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
